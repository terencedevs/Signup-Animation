<!doctype html>
<link rel="stylesheet" href="style.css"> <!-- added: not shown in video -->
<div class="scene">
  <div class="neon-ring"></div>
  <div class="card">
    <form class="face front">
      <h2>WELCOME</h2>
      <p>Login to your account</p>
      <input type="email" placeholder="Email Address">
      <input type="password" placeholder="Password">
      <div class="options">
        <label><input type="checkbox">Remember me</label>
        <a href="#">Forgot?</a>
      </div>
      <button type="button">LOGIN</button>
      <p>Don't have an account?
        <a class="show-signup" href="#">Sign Up</a></p>
    </form>
    <form class="face back">
      <h2>SIGN UP</h2>
      <p>Create your account</p>
      <input type="text" placeholder="Full Name">
      <input type="email" placeholder="Email Address">
      <input type="password" placeholder="Password">
      <button type="button">CREATE ACCOUNT</button>
      <p>Already have an account?
        <a class="show-login" href="#">Login</a></p>
    </form>
  </div>
</div>
<script src="script.js"></script> <!-- added: not shown in video -->
